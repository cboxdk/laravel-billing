name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    name: PHP ${{ matrix.php }} · Testbench ${{ matrix.testbench }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        testbench: ['11.*']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # Audit the COMMITTED lock before re-resolving. `composer update` below resolves a
      # fresh tree, so the audit inside `composer qa` inspects versions that were never
      # shipped — which is how a lockfile carrying three open Guzzle advisories stayed
      # green. This step is what actually guards the published artifact.
      - name: Audit the committed lockfile
        run: composer audit --locked --no-dev

      # SBOM drift, also against the committed lock: the published sbom.json must
      # describe the tree that ships, and nothing else regenerates it.
      - name: SBOM is not stale
        run: |
          composer sbom
          git diff --exit-code sbom.json

      - name: Constrain Testbench (Laravel major)
        run: composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: QA gate (pint · phpstan · pest · license-check · audit)
        run: composer qa
